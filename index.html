<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Под солнцем</title>
<link rel="stylesheet" href="css/style.css?v=881ac4af">
<!-- Снаружи Telegram этот скрипт ничего не делает, игра работает как обычно. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">

  <section id="choose">
    <div id="meta" class="hidden">
      <div class="head">
        <h2 class="serif">Палата влияния</h2>
        <span class="bal" id="metaBal"></span>
      </div>
      <div id="metalist"></div>
      <div id="mastery" class="hidden">
        <h2>Освоенные пути</h2>
        <div id="masterylist"></div>
      </div>
    </div>
    <h1 id="chooseTitle">С чего начнёшь?</h1>
    <p class="lead" id="chooseLead">Путь определяет, что приносит деньги. Дойдёшь до потолка — сможешь начать заново другим путём и сохранить накопленное влияние.</p>
    <div id="pathlist"></div>
  </section>

  <section id="game" class="hidden">
    <header>
      <div class="capital">
        <span class="sum" id="money">0</span>
        <span class="per" id="income"></span>
      </div>
      <div class="toprow">
        <div class="pathline" id="pathline"></div>
        <button id="sound">Звук</button>
      </div>
      <div id="buffline"></div>
      <div class="legacybar" id="legacybar">
        <div class="bar"><div class="fill" id="legacyfill"></div></div>
        <div class="cap"><span id="legacycap"></span><span id="legacynext"></span></div>
      </div>
      <div class="focus">
        <div class="bar"><div class="fill" id="focusfill"></div></div>
        <div class="cap"><span>Концентрация</span><span id="focusnote">полная отдача</span></div>
      </div>
    </header>

    <div id="pane-taps" class="pane">
    <div id="welcome" class="hidden"></div>

    <div id="tapzone">
      <button id="tap"><span id="taplabel">Работать</span><span class="val" id="tapval"></span></button>
    </div>

    <button id="eventcard" class="hidden">
      <div class="t">
        <div class="h">Развилка</div>
        <div class="s" id="eventHint"></div>
      </div>
      <div class="go">Разобраться</div>
    </button>

    <button id="ability" class="hidden">
      <div class="cd" id="abilityCd"></div>
      <div class="inner">
        <div class="t">
          <div class="h" id="abilityName"></div>
          <div class="s" id="abilityDesc"></div>
        </div>
        <div class="when" id="abilityWhen"></div>
      </div>
    </button>

    <button id="rebirth" class="hidden">
      <div class="t">
        <div class="h">Начать сначала</div>
        <div class="s" id="rebirthSub"></div>
      </div>
      <div class="pts" id="rebirthPts"></div>
    </button>

    <div class="shophead">
      <h2>Отдача от рук</h2>
      <button id="bulk">×1</button>
    </div>
    <div id="uplist-tap"></div>

    <div class="shophead sub"><h2>Работает само</h2></div>
    <div id="uplist-income"></div>

    <div id="perks">
      <div class="shophead sub"><h2 id="perkshead">Особое</h2></div>
      <div id="perklist"></div>
    </div>
    </div>

    <div id="pane-profile" class="pane hidden">
      <div id="profile"></div>
      <button id="achbtn"></button>
      <div id="achlist"></div>
      <footer><button id="reset">Стереть всё</button></footer>
    </div>

    <div id="pane-capital" class="pane hidden">
      <div id="capital"></div>
    </div>

    <nav id="tabs">
      <button class="tab" data-pane="profile">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg>
        <span>Профиль</span>
      </button>
      <button class="tab main is-on" data-pane="taps">
        <span class="dot" id="tabdot"></span>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M6 6l1.5 1.5M16.5 16.5L18 18M18 6l-1.5 1.5M7.5 16.5L6 18"/></svg>
        <span>Тапы</span>
      </button>
      <button class="tab" data-pane="capital">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16v11H4zM4 8l3-4h10l3 4M9 12h6"/></svg>
        <span>Капитал</span>
      </button>
    </nav>
  </section>
  <div id="modal" class="hidden">
    <div class="card">
      <h2 id="modalTitle" class="serif"></h2>
      <div class="txt" id="modalText"></div>
      <div class="row">
        <button id="modalNo">Отмена</button>
        <button id="modalYes" class="go">Продолжить</button>
      </div>
    </div>
  </div>
</div>

<!-- Порядок важен: обычные скрипты, общая область видимости. -->
<script src="js/content.js?v=9bb35d6b"></script>
<script src="js/economy.js?v=12e59cb4"></script>
<script src="js/systems.js?v=359e7955"></script>
<script src="js/telegram.js?v=6b91e6d7"></script>
<script src="js/rating.js?v=e27ab679"></script>
<script src="js/ui.js?v=1fe7eb3c"></script>
<script src="js/boot.js?v=5e053f66"></script>
</body>
</html>
