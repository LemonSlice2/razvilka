compatibility_date = "2026-09-01"

# Кем разрешено дёргать ручки. Звёздочка тоже работает, но лучше сузить.
[vars]
ALLOW_ORIGIN = "https://lemonslice2.github.io"
# Кнопка «Открыть игру» в уведомлении о нападении
GAME_URL = "https://lemonslice2.github.io/razvilka/"

# База создана командой wrangler d1 create pod-solncem-rating.
[[d1_databases]]
binding = "DB"
database_name = "pod-solncem-rating"
database_id = "f736ff46-bc96-4af6-bfb5-68dd5b3e3fb0"
