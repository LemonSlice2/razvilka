name = "pod-solncem-rating"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Кем разрешено дёргать ручки. Звёздочка тоже работает, но лучше сузить.
[vars]
ALLOW_ORIGIN = "https://lemonslice2.github.io"

# База заполняется командой из README: wrangler d1 create pod-solncem-rating
# и полученный database_id вписывается сюда.
[[d1_databases]]
binding = "DB"
database_name = "pod-solncem-rating"
database_id = "ВПИШИ_СЮДА_ID_ИЗ_wrangler_d1_create"
